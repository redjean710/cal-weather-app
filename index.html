<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 달력</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --col-sun: #e03535;
  --col-sat: #2563eb;
  --col-week: #1a1a1a;
  --col-holiday: #e03535;
  --col-bg: #f8f7f4;
  --col-card: #ffffff;
  --col-border: #e8e5e0;
  --col-accent: #1a1a1a;
  --col-muted: #9a9690;
  --col-popup-bg: rgba(0,0,0,0.45);
  --radius: 12px;
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--col-bg);
  color: var(--col-week);
  min-height: 100vh;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1rem;
  background: var(--col-card);
  border-bottom: 1px solid var(--col-border);
  position: sticky;
  top: 0;
  z-index: 10;
  gap: 8px;
}

.header-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.5px;
  white-space: nowrap;
  flex-shrink: 0;
}

.header-nav {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.month-label {
  font-size: 17px;
  font-weight: 700;
  min-width: 120px;
  text-align: center;
  letter-spacing: -0.3px;
  user-select: none;
}

.month-nav-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}

.month-nav-btn {
  border: 1px solid var(--col-border);
  background: var(--col-card);
  color: var(--col-week);
  border-radius: 6px;
  width: 28px;
  height: 28px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}
.month-nav-btn:hover {
  background: var(--col-bg);
  border-color: var(--col-accent);
}

@media (max-width: 768px) {
  .month-nav-btn.desktop-only {
    display: none !important;
  }
}

.notif-btn {
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border: 1px solid var(--col-border);
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  color: var(--col-week);
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.notif-btn:hover { background: var(--col-bg); }
.notif-btn.active {
  background: var(--col-accent);
  color: #fff;
  border-color: var(--col-accent);
}

.today-btn {
  font-size: 13px;
  font-weight: 500;
  padding: 6px 14px;
  border: 1px solid var(--col-border);
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  color: var(--col-week);
  transition: background 0.15s;
}
.today-btn:hover { background: var(--col-bg); }

/* ── Calendar ── */
.calendar-wrap {
  padding: 1rem 1rem 0.5rem;
  max-width: 1100px;
  margin: 0 auto;
  touch-action: pan-y pinch-zoom; /* 좌우 스와이프 활성화 */
  user-select: none; /* 드래그 시 텍스트 선택 방지 */
  cursor: grab;
}
.calendar-wrap:active {
  cursor: grabbing;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--col-border);
  border: 1px solid var(--col-border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}

/* ── Weekday headers ── */
.dow-header {
  background: var(--col-card);
  text-align: center;
  padding: 10px 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.dow-header.dow-sun { color: var(--col-sun); }
.dow-header.dow-sat { color: var(--col-sat); }

/* ── Day cells ── */
.day-cell {
  background: var(--col-card);
  height: 95px;
  min-height: 95px;
  max-height: 95px;
  padding: 6px 8px 6px;
  cursor: pointer;
  position: relative;
  transition: background 0.12s;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.day-cell:hover { background: #f9f8f5; }
.day-cell.other-month { background: #fafafa; }
.day-cell.other-month .day-num { color: #ccc; }

.day-cell.today .day-num {
  background: var(--col-accent);
  color: #fff;
  border-radius: 50%;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
}

.day-num-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}

.more-sched-icon {
  font-size: 11px;
  color: var(--col-muted);
  font-weight: 700;
  line-height: 1;
  padding-right: 2px;
  user-select: none;
}

.day-num {
  font-size: 13px;
  font-weight: 500;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.day-cell.sun .day-num, .day-cell.holiday-cell .day-num { color: var(--col-sun); }
.day-cell.sat .day-num { color: var(--col-sat); }
.day-cell.today .day-num { color: #fff !important; }

.holiday-name {
  font-size: 10px;
  color: var(--col-holiday);
  font-weight: 500;
  margin-top: 1px;
  line-height: 1.3;
  word-break: keep-all;
}
.subst-badge {
  font-size: 9px;
  background: #fff0f0;
  color: var(--col-holiday);
  border-radius: 3px;
  padding: 1px 4px;
  display: inline-block;
  margin-top: 1px;
  font-weight: 600;
}

/* ── Schedules inside cell ── */
.schedules {
  margin-top: 3px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}
.sched-chip {
  font-size: 11px;
  padding: 2px 5px;
  border-radius: 4px;
  background: #eef2ff;
  color: #3730a3;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  font-weight: 500;
  line-height: 1.5;
}
.sched-chip:hover { background: #e0e7ff; }
.sched-chip.off-chip {
  background: #fef3c7;
  color: #92400e;
}

/* ── Monthly summary ── */
.month-summary {
  background: var(--col-card);
  border: 1px solid var(--col-border);
  border-top: none;
  padding: 10px 16px;
  font-size: 12px;
  color: var(--col-muted);
  display: flex;
  gap: 20px;
  border-radius: 0 0 var(--radius) var(--radius);
}
.month-summary span { font-weight: 500; }
.month-summary .sum-val { color: var(--col-week); font-weight: 700; }

/* ── Popup overlay ── */
.popup-overlay {
  display: none;
  position: fixed; inset: 0;
  background: var(--col-popup-bg);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.popup-overlay.open { display: flex; }

.popup {
  background: var(--col-card);
  border-radius: var(--radius);
  width: 380px;
  max-width: calc(100vw - 32px);
  box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  overflow: hidden;
}

.popup-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--col-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.popup-date {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.popup-close {
  width: 30px; height: 30px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 18px;
  color: var(--col-muted);
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
}
.popup-close:hover { background: var(--col-bg); color: var(--col-week); }

.popup-body { padding: 16px 20px; }

.form-group { margin-bottom: 14px; }
.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--col-muted);
  margin-bottom: 5px;
  display: block;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.form-input, .form-select {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--col-border);
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--col-week);
  background: var(--col-bg);
  outline: none;
  transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus {
  border-color: var(--col-accent);
  background: #fff;
}

/* ── Date Range & DatePicker Modal ── */
.date-range-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.date-picker-btn {
  flex: 1;
  padding: 8px 10px;
  border: 1px solid var(--col-border);
  border-radius: 8px;
  background: var(--col-card);
  font-size: 13px;
  font-weight: 500;
  color: var(--col-week);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.date-picker-btn:hover {
  border-color: var(--col-accent);
}
.date-range-separator {
  color: var(--col-muted);
  font-size: 14px;
  font-weight: 600;
}

.date-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.date-modal-overlay.open {
  display: flex;
}
.date-picker-modal {
  background: var(--col-card);
  border-radius: var(--radius);
  width: 310px;
  max-width: 90vw;
  padding: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  animation: popIn 0.2s ease;
}
.date-picker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.date-picker-title {
  font-size: 15px;
  font-weight: 700;
}
.date-picker-nav-btn {
  border: 1px solid var(--col-border);
  background: transparent;
  border-radius: 6px;
  width: 28px;
  height: 28px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.date-picker-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  text-align: center;
}
.dp-dow {
  font-size: 11px;
  font-weight: 600;
  color: var(--col-muted);
  padding-bottom: 4px;
}
.dp-dow.sun { color: var(--col-sun); }
.dp-dow.sat { color: var(--col-sat); }
.dp-day {
  font-size: 12px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
}
.dp-day:hover {
  background: var(--col-bg);
}
.dp-day.selected {
  background: var(--col-accent);
  color: #fff !important;
  font-weight: 700;
}
.dp-day.other-month {
  color: #ccc;
}
.dp-day.sun { color: var(--col-sun); }
.dp-day.sat { color: var(--col-sat); }
.date-picker-footer {
  margin-top: 12px;
  display: flex;
  justify-content: flex-end;
}

/* ── Repeat Checkboxes & Number Wheel ── */
.repeat-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.repeat-checkboxes {
  display: flex;
  align-items: center;
  gap: 10px;
}
.repeat-chk-label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  color: var(--col-week);
}
.repeat-chk-label input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--col-accent);
  cursor: pointer;
}
.wheel-container-wrapper {
  background: var(--col-bg);
  border: 1px solid var(--col-border);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.wheel-label-info {
  font-size: 12px;
  font-weight: 700;
  color: var(--col-accent);
}
.number-wheel {
  display: flex;
  gap: 8px;
  width: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 6px 10px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.number-wheel::-webkit-scrollbar {
  display: none;
}
.wheel-item {
  flex: 0 0 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--col-card);
  border: 1px solid var(--col-border);
  font-size: 13px;
  font-weight: 600;
  color: var(--col-week);
  cursor: pointer;
  scroll-snap-align: center;
  transition: all 0.15s ease;
  user-select: none;
}
.wheel-item:hover {
  border-color: var(--col-accent);
}
.wheel-item.active {
  background: var(--col-accent);
  color: #ffffff;
  border-color: var(--col-accent);
  font-weight: 700;
  transform: scale(1.1);
}
.sched-badge {
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--col-bg);
  color: var(--col-muted);
  border: 1px solid var(--col-border);
  margin-left: 6px;
  font-weight: 500;
  display: inline-block;
}

.popup-footer {
  padding: 12px 20px 16px;
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.btn-cancel {
  padding: 8px 18px;
  border: 1px solid var(--col-border);
  border-radius: 8px;
  background: transparent;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--col-muted);
  font-family: 'Noto Sans KR', sans-serif;
}
.btn-cancel:hover { background: var(--col-bg); }
.btn-save {
  padding: 8px 18px;
  border: none;
  border-radius: 8px;
  background: var(--col-accent);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: opacity 0.15s;
}
.btn-save:hover { opacity: 0.8; }
.btn-delete {
  padding: 8px 14px;
  border: 1px solid #fca5a5;
  border-radius: 8px;
  background: transparent;
  color: var(--col-holiday);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  margin-right: auto;
}
.btn-delete:hover { background: #fff5f5; }

/* ── Schedule list in popup ── */
.sched-list { margin-bottom: 14px; }
.sched-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px;
  border-radius: 7px;
  border: 1px solid var(--col-border);
  margin-bottom: 5px;
  font-size: 13px;
  background: var(--col-bg);
}
.sched-item-text { flex: 1; font-weight: 500; }
.sched-item-repeat { font-size: 11px; color: var(--col-muted); margin-left: 6px; }
.sched-item-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}
.sched-edit-btn {
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  font-size: 13px;
  opacity: 0.7;
  transition: opacity 0.15s;
}
.sched-edit-btn:hover { opacity: 1; }
.sched-del-btn {
  border: none;
  background: transparent;
  color: var(--col-muted);
  cursor: pointer;
  font-size: 16px;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
}
.sched-del-btn:hover { background: #fee2e2; color: var(--col-holiday); }

.add-sched-toggle {
  font-size: 12px;
  font-weight: 600;
  color: var(--col-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 0;
  border: none;
  background: transparent;
  font-family: 'Noto Sans KR', sans-serif;
  letter-spacing: 0.2px;
}
.add-sched-toggle:hover { color: var(--col-week); }
.add-form { margin-top: 10px; display: none; }
.add-form.open { display: block; }

.holiday-info {
  font-size: 12px;
  color: var(--col-holiday);
  font-weight: 600;
  padding: 6px 10px;
  background: #fff5f5;
  border-radius: 7px;
  margin-bottom: 12px;
  display: none;
}

/* ── 날씨 위젯 스타일 ── */
.weather-widget {
  max-width: 1100px;
  margin: 1.5rem auto;
  padding: 0 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.weather-card {
  background: var(--col-card);
  border: 1px solid var(--col-border);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
}

.weather-top {
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  gap: 1rem;
}

.weather-location {
  font-size: 14px;
  font-weight: 600;
  color: var(--col-muted);
  margin-bottom: 4px;
}

.weather-temp {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1px;
}

.weather-desc {
  font-size: 15px;
  font-weight: 500;
  color: var(--col-week);
}

.weather-icon {
  font-size: 40px;
  margin-top: 8px;
}

.weather-detail-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 1rem;
}

.weather-detail-item {
  background: var(--col-bg);
  padding: 8px;
  border-radius: 8px;
  text-align: center;
}

.weather-detail-label {
  font-size: 10px;
  color: var(--col-muted);
  margin-bottom: 2px;
}

.weather-detail-value {
  font-size: 13px;
  font-weight: 600;
}

#weatherChartWrap {
  height: 180px;
  margin-top: 10px;
}

.weather-forecast-icons {
  display: flex;
  overflow-x: auto;
  gap: 12px;
  padding: 10px 0;
  scrollbar-width: none;
}
.weather-forecast-icons::-webkit-scrollbar { display: none; }

.weather-forecast-day {
  min-width: 60px;
  text-align: center;
  flex-shrink: 0;
}

.weather-forecast-date {
  font-size: 11px;
  color: var(--col-muted);
}

.weather-forecast-emoji {
  font-size: 24px;
  margin: 4px 0;
}

.weather-forecast-temp {
  font-size: 11px;
  font-weight: 600;
}

@media (max-width: 600px) {
  .weather-top {
    grid-template-columns: 1fr;
  }
  .weather-detail-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
<!-- Chart.js CDN (로컬 파일 누락 에러 방지) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="header">
  <div class="header-title">📅 우리집 달력</div>
  <div class="header-nav">
    <button class="notif-btn" id="notifBtn" onclick="requestNotificationPermission()">🔔 알림</button>
    <button class="today-btn" onclick="goToday()">오늘</button>
    <div class="month-nav-wrap">
      <button type="button" class="month-nav-btn desktop-only" title="이전 달" onclick="changeMonth(-1)">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button type="button" class="month-nav-btn desktop-only" title="다음 달" onclick="changeMonth(1)">›</button>
    </div>
  </div>
</div>

<div class="calendar-wrap">
  <div class="cal-grid" id="calGrid"></div>
  <div class="month-summary" id="monthSummary"></div>
</div>

<!-- 날씨 위젯 HTML -->
<div class="weather-widget">
  <div class="weather-top">
    <div class="weather-card">
      <div class="weather-location" id="weatherLocation">위치 확인 중...</div>
      <div style="display:flex; align-items:center; gap:15px">
        <div>
          <div class="weather-temp" id="weatherTemp">--°C</div>
          <div class="weather-desc" id="weatherDesc">날씨 로딩 중...</div>
        </div>
        <div class="weather-icon" id="weatherIcon">☀️</div>
      </div>
      <div class="weather-detail-grid">
        <div class="weather-detail-item">
          <div class="weather-detail-label">습도</div>
          <div class="weather-detail-value" id="weatherHumidity">--%</div>
        </div>

function getAllHolidays(year) {
  const fixed = getFixedHolidays(year);
  const lunar = lunarHolidays[year] || {};
  const election = {};
  for (const [d, name] of Object.entries(electionHolidays)) {
    if (d.startsWith(String(year))) election[d] = name;
  }
  return { ...fixed, ...lunar, ...election };
}

function parseDateParts(str) {
  if (!str) return new Date();
  const parts = String(str).split('-').map(Number);
  if (parts.length < 3) return new Date(str);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function getSubstituteHolidays(year) {
  const all = getAllHolidays(year);
  const subst = {};
  const satSunSubstNames = ["삼일절", "어린이날", "부처님오신날", "제헌절", "광복절", "개천절", "한글날"];
  const lunarBlocks = [
    ["설날 전날", "설날", "설날 다음날"],
    ["추석 전날", "추석", "추석 다음날"]
  ];

  const occupied = new Set(Object.keys(all));

  function findNextWorkday(dateStr) {
    let cur = parseDateParts(dateStr);
    let count = 0;
    while (count++ < 30) {
      cur.setDate(cur.getDate() + 1);
      const k = fmtDate(cur);
      const day = cur.getDay();
      if (day !== 0 && day !== 6 && !occupied.has(k) && !subst[k]) {
        return k;
      }
    }
    return dateStr;
  }

  Object.keys(all).sort().forEach(k => {
    const name = all[k];
    if (satSunSubstNames.includes(name)) {
      const d = parseDateParts(k);
      const dow = d.getDay();
      if (dow === 0 || dow === 6) {
        const nextWorkday = findNextWorkday(k);
        subst[nextWorkday] = `${name} 대체공휴일`;
        occupied.add(nextWorkday);
      }
    }
  });

  lunarBlocks.forEach(block => {
    const blockKeys = Object.keys(all).filter(k => block.includes(all[k])).sort();
    if (blockKeys.length === 0) return;

    let needSubstCount = 0;
    blockKeys.forEach(k => {
      const d = parseDateParts(k);
      const dow = d.getDay();
      const otherFixed = Object.keys(getFixedHolidays(year)).filter(fk => fk === k);
      if (dow === 0 || otherFixed.length > 0) {
        needSubstCount++;
      }
    });

    const lastKey = blockKeys[blockKeys.length - 1];
    let curCheckDate = lastKey;
    for (let i = 0; i < needSubstCount; i++) {
      const nextWorkday = findNextWorkday(curCheckDate);
      const label = block[1].includes("설날") ? "설날 연휴 대체공휴일" : "추석 연휴 대체공휴일";
      subst[nextWorkday] = label;
      occupied.add(nextWorkday);
      curCheckDate = nextWorkday;
    }
  });

  return subst;
}

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function goToday() {
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth() + 1;
  render();
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  render();
}

function truncateByBytes(str, maxBytes = 8) {
  if (!str) return '';
  let bytes = 0;
  let result = '';
  for (let i = 0; i < str.length; i++) {
    const ch = str.charAt(i);
    const charBytes = (str.charCodeAt(i) > 0x7f) ? 2 : 1;
    if (bytes + charBytes > maxBytes) break;
    bytes += charBytes;
    result += ch;
  }
  return result;
}

function render() {
  const year = currentYear, month = currentMonth;
  const monthLabel = document.getElementById('monthLabel');
  if (monthLabel) monthLabel.textContent = `${year}년 ${month}월`;
  
  const allHols = { ...getAllHolidays(year), ...getSubstituteHolidays(year) };
  const grid = document.getElementById('calGrid');
  if (!grid) return;
  grid.innerHTML = '';

  const dows = ['일','월','화','수','목','금','토'];
  dows.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'dow-header' + (i === 0 ? ' dow-sun' : (i === 6 ? ' dow-sat' : ''));
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month - 1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const daysInPrev = new Date(year, month - 1, 0).getDate();
  const todayKey = fmtDate(new Date());

  let holidayCount = 0;
  let offCount = 0;
  
  for (let d = 1; d <= daysInMonth; d++) {
    const dk = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const wd = new Date(year, month - 1, d).getDay();
    const hasCustomHol = getSchedulesForDate(dk).some(s => s && s.text && s.text.includes('공휴일'));
    if (wd === 0 || wd === 6 || allHols[dk] || hasCustomHol) holidayCount++;
  }

  const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    let cd, cy, cm, isOther = false;
    if (i < firstDay) {
      cd = daysInPrev - firstDay + i + 1;
      cy = month === 1 ? year - 1 : year;
      cm = month === 1 ? 12 : month - 1;
      isOther = true;
    } else if (i >= firstDay + daysInMonth) {
      cd = i - firstDay - daysInMonth + 1;
      cy = month === 12 ? year + 1 : year;
      cm = month === 12 ? 1 : month + 1;
      isOther = true;
    } else {
      cd = i - firstDay + 1; cy = year; cm = month;
    }

    const dk = `${cy}-${String(cm).padStart(2,'0')}-${String(cd).padStart(2,'0')}`;
    const dow = i % 7;
    const dayScheds = getSchedulesForDate(dk);
    const isCustomHol = dayScheds.some(s => s && s.text && s.text.includes('공휴일'));

    if (isOther) cell.classList.add('other-month');
    if (dow === 0) cell.classList.add('sun');
    if (dow === 6) cell.classList.add('sat');
    if (allHols[dk] || isCustomHol) cell.classList.add('holiday-cell');
    if (dk === todayKey) cell.classList.add('today');

    const numRow = document.createElement('div');
    numRow.className = 'day-num-row';

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = cd;
    numRow.appendChild(numEl);

    if (dayScheds.length >= 4) {
      const moreIcon = document.createElement('span');
      moreIcon.className = 'more-sched-icon';
      moreIcon.title = `일정 총 ${dayScheds.length}개`;
      moreIcon.textContent = '☰';
      numRow.appendChild(moreIcon);
    }

    cell.appendChild(numRow);

    if (allHols[dk]) {
      const hn = document.createElement('div');
      hn.className = 'holiday-name';
      const name = allHols[dk];
      hn.innerHTML = name.includes('대체') ? `<span class="subst-badge">대체휴일</span> ${name.replace(' 대체공휴일','')}` : name;
      cell.appendChild(hn);
    }

    if (dayScheds.length > 0) {
      const sEl = document.createElement('div');
      sEl.className = 'schedules';
      dayScheds.slice(0, 3).forEach(s => {
        const chip = document.createElement('div');
        const isOff = s && s.text && s.text.toLowerCase().includes('off');
        chip.className = 'sched-chip' + (isOff ? ' off-chip' : '');
        chip.textContent = truncateByBytes(s ? s.text : '', 8);
        sEl.appendChild(chip);
        if (!isOther && isOff) offCount++;
      });
      cell.appendChild(sEl);
    }
    
    // 제스처 스와이프 도중 클릭 방지
    cell.onclick = () => {
      if (isDraggingCalendar) return;
      openPopup(dk, cy, cm, cd);
    };
    grid.appendChild(cell);
  }

  const summaryEl = document.getElementById('monthSummary');
  if (summaryEl) {
    summaryEl.innerHTML = `<span>공휴일 (토·일 포함) <span class="sum-val">${holidayCount}일</span></span><span>OFF <span class="sum-val">${offCount}일</span></span>`;
  }

  autoCheckTodaySchedules();
}
}

// ─────────────────────────────────────────────
//  SWIPE & DRAG GESTURE FOR MONTH NAVIGATION
// ─────────────────────────────────────────────
function initCalendarGestures() {
  const calArea = document.querySelector('.calendar-wrap');
  if (!calArea) return;

  let startX = 0;
  let startY = 0;
  let isPointerDown = false;
  const THRESHOLD = 50;

  // 1. 터치 제스처
  calArea.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    isDraggingCalendar = false;
  }, { passive: true });

  calArea.addEventListener('touchmove', (e) => {
    const diffX = e.touches[0].clientX - startX;
    if (Math.abs(diffX) > 10) isDraggingCalendar = true;
  }, { passive: true });

  calArea.addEventListener('touchend', (e) => {
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    handleSwipe(startX, startY, endX, endY);
    setTimeout(() => { isDraggingCalendar = false; }, 80);
  }, { passive: true });

  // 2. 마우스 드래그 (PC 지원)
  calArea.addEventListener('mousedown', (e) => {
    if (e.target.closest('#popupOverlay')) return;
    isPointerDown = true;
    startX = e.clientX;
    startY = e.clientY;
    isDraggingCalendar = false;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isPointerDown) return;
    if (Math.abs(e.clientX - startX) > 10) {
      isDraggingCalendar = true;
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (!isPointerDown) return;
    isPointerDown = false;
    handleSwipe(startX, startY, e.clientX, e.clientY);
    setTimeout(() => { isDraggingCalendar = false; }, 80);
  });

  function handleSwipe(sX, sY, eX, eY) {
    const diffX = eX - sX;
    const diffY = eY - sY;

    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > THRESHOLD) {
      if (diffX < 0) {
        changeMonth(1);  // 왼쪽 스와이프 -> 다음 달
      } else {
        changeMonth(-1); // 오른쪽 스와이프 -> 이전 달
      }
    }
  }
}

// ─────────────────────────────────────────────
//  DATE RANGE PICKER & SUB-MODAL
// ─────────────────────────────────────────────
let pickerMode = 'start';
let selectedStartDate = '';
let selectedEndDate = '';
let dpYear = 2025;
let dpMonth = 5;

function openDatePickerModal(mode) {
  pickerMode = mode;
  const initialDateStr = mode === 'start' ? selectedStartDate : selectedEndDate;
  if (initialDateStr) {
    const parts = initialDateStr.split('-').map(Number);
    if (parts.length === 3) {
      dpYear = parts[0];
      dpMonth = parts[1];
    }
  } else {
    const now = new Date();
    dpYear = now.getFullYear();
    dpMonth = now.getMonth() + 1;
  }
  renderDatePicker();
  const overlay = document.getElementById('datePickerOverlay');
  if (overlay) overlay.classList.add('open');
}

function closeDatePickerModal() {
  const overlay = document.getElementById('datePickerOverlay');
  if (overlay) overlay.classList.remove('open');
}

function handleDatePickerOverlayClick(e) {
  if (e.target.id === 'datePickerOverlay') closeDatePickerModal();
}

function changeDatePickerMonth(delta) {
  dpMonth += delta;
  if (dpMonth > 12) { dpMonth = 1; dpYear++; }
  if (dpMonth < 1) { dpMonth = 12; dpYear--; }
  renderDatePicker();
}

function renderDatePicker() {
  const title = document.getElementById('datePickerTitle');
  if (title) title.textContent = `${dpYear}년 ${dpMonth}월`;

  const grid = document.getElementById('datePickerGrid');
  if (!grid) return;
  grid.innerHTML = '';

  const dows = ['일','월','화','수','목','금','토'];
  dows.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'dp-dow' + (i === 0 ? ' sun' : (i === 6 ? ' sat' : ''));
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(dpYear, dpMonth - 1, 1).getDay();
  const daysInMonth = new Date(dpYear, dpMonth, 0).getDate();
  const daysInPrev = new Date(dpYear, dpMonth - 1, 0).getDate();

  const activeDate = pickerMode === 'start' ? selectedStartDate : selectedEndDate;
  const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'dp-day';
    let cd, cy, cm, isOther = false;
    if (i < firstDay) {
      cd = daysInPrev - firstDay + i + 1;
      cy = dpMonth === 1 ? dpYear - 1 : dpYear;
      cm = dpMonth === 1 ? 12 : dpMonth - 1;
      isOther = true;
    } else if (i >= firstDay + daysInMonth) {
      cd = i - firstDay - daysInMonth + 1;
      cy = dpMonth === 12 ? dpYear + 1 : dpYear;
      cm = dpMonth === 12 ? 1 : dpMonth + 1;
      isOther = true;
    } else {
      cd = i - firstDay + 1; cy = dpYear; cm = dpMonth;
    }

    const dk = `${cy}-${String(cm).padStart(2,'0')}-${String(cd).padStart(2,'0')}`;
    const dow = i % 7;

    if (isOther) cell.classList.add('other-month');
    if (dow === 0) cell.classList.add('sun');
    if (dow === 6) cell.classList.add('sat');
    if (dk === activeDate) cell.classList.add('selected');

    cell.textContent = cd;
    cell.onclick = () => selectDateFromPicker(dk);
    grid.appendChild(cell);
  }
}

function selectDateFromPicker(dk) {
  if (pickerMode === 'start') {
    selectedStartDate = dk;
    if (selectedEndDate < selectedStartDate) {
      selectedEndDate = selectedStartDate;
    }
  } else {
    selectedEndDate = dk;
    if (selectedStartDate > selectedEndDate) {
      selectedStartDate = selectedEndDate;
    }
  }
  updateDateRangeLabels();
  closeDatePickerModal();
}

function updateDateRangeLabels() {
  const lblStart = document.getElementById('startDateLabel');
  const lblEnd = document.getElementById('endDateLabel');
  if (lblStart) lblStart.textContent = selectedStartDate || '--';
  if (lblEnd) lblEnd.textContent = selectedEndDate || '--';
}

function getSchedulesForDate(dk) {
  const res = [];
  const parts = dk.split('-').map(Number);
  const dObj = new Date(parts[0], parts[1] - 1, parts[2]);

  if (!schedules || typeof schedules !== 'object') return res;

  for (const ok in schedules) {
    if (!Array.isArray(schedules[ok])) continue;

    schedules[ok].forEach(s => {
      if (!s || !s.text) return;

      const sStart = s.startDate || ok;
      const sEnd = s.endDate || sStart;

      if (!s.repeat || s.repeat === 'none') {
        if (dk >= sStart && dk <= sEnd) res.push(s);
        return;
      }

      const oParts = sStart.split('-').map(Number);
      if (oParts.length !== 3) return;
      const oObj = new Date(oParts[0], oParts[1] - 1, oParts[2]);
      if (dObj < oObj) return;

      let unit = '';
      let interval = 1;

      if (typeof s.repeat === 'object' && s.repeat.unit) {
        unit = s.repeat.unit;
        interval = Number(s.repeat.value) || 1;
      } else if (typeof s.repeat === 'string') {
        if (s.repeat.startsWith('day-')) {
          unit = 'day';
          interval = Number(s.repeat.split('-')[1]) || 1;
        } else if (s.repeat.startsWith('month-')) {
          unit = 'month';
          interval = Number(s.repeat.split('-')[1]) || 1;
        } else if (s.repeat.startsWith('year-')) {
          unit = 'year';
          interval = Number(s.repeat.split('-')[1]) || 1;
        } else if (s.repeat === 'every6') {
          unit = 'day';
          interval = 6;
        } else if (s.repeat === 'monthly-day') {
          unit = 'month';
          interval = 1;
        } else if (s.repeat === 'yearly') {
          unit = 'year';
          interval = 1;
        }
      }

      if (unit === 'day') {
        const diffDays = Math.round((dObj - oObj) / 86400000);
        if (diffDays >= 0 && diffDays % interval === 0) res.push(s);
      } else if (unit === 'month') {
        const monthDiff = (parts[0] - oParts[0]) * 12 + (parts[1] - oParts[1]);
        if (monthDiff >= 0 && monthDiff % interval === 0 && parts[2] === oParts[2]) res.push(s);
      } else if (unit === 'year') {
        const yearDiff = parts[0] - oParts[0];
        if (yearDiff >= 0 && yearDiff % interval === 0 && parts[1] === oParts[1] && parts[2] === oParts[2]) res.push(s);
      }
    });
  }

  return res;
}

function getRepeatText(repeat) {
  if (!repeat || repeat === 'none') return '';
  if (typeof repeat === 'object') {
    const u = repeat.unit;
    const v = Number(repeat.value) || 1;
    if (u === 'day') return v === 1 ? '매일' : `${v}일마다`;
    if (u === 'month') return v === 1 ? '매월' : `${v}개월마다`;
    if (u === 'year') return v === 1 ? '매년' : `${v}년마다`;
  } else if (typeof repeat === 'string') {
    if (repeat.startsWith('day-')) return `${repeat.split('-')[1]}일마다`;
    if (repeat.startsWith('month-')) return `${repeat.split('-')[1]}개월마다`;
    if (repeat.startsWith('year-')) return `${repeat.split('-')[1]}년마다`;
    if (repeat === 'every6') return '6일마다';
    if (repeat === 'monthly-day') return '매월';
    if (repeat === 'yearly') return '매년';
  }
  return '';
}

// ─────────────────────────────────────────────
//  REPEAT SELECTION & WHEEL
// ─────────────────────────────────────────────
let selectedRepeatUnit = 'none';
let selectedWheelValue = 1;

function selectRepeatUnit(unit) {
  if (selectedRepeatUnit === unit && unit !== 'none') {
    selectedRepeatUnit = 'none';
  } else {
    selectedRepeatUnit = unit;
  }

  const chkNone = document.getElementById('chkRepeatNone');
  const chkDay = document.getElementById('chkRepeatDay');
  const chkMonth = document.getElementById('chkRepeatMonth');
  const chkYear = document.getElementById('chkRepeatYear');

  if (chkNone) chkNone.checked = (selectedRepeatUnit === 'none');
  if (chkDay) chkDay.checked = (selectedRepeatUnit === 'day');
  if (chkMonth) chkMonth.checked = (selectedRepeatUnit === 'month');
  if (chkYear) chkYear.checked = (selectedRepeatUnit === 'year');

  const wrapper = document.getElementById('wheelWrapper');
  if (wrapper) {
    if (selectedRepeatUnit === 'none') {
      wrapper.style.display = 'none';
    } else {
      wrapper.style.display = 'flex';
      initNumberWheel();
    }
  }
}

function initNumberWheel() {
  const wheel = document.getElementById('numberWheel');
  if (!wheel) return;
  let html = '';
  for (let i = 1; i <= 31; i++) {
    html += `<div class="wheel-item ${i === selectedWheelValue ? 'active' : ''}" id="wheel-item-${i}" onclick="selectWheelValue(${i})">${i}</div>`;
  }
  wheel.innerHTML = html;

  let isScrolling;
  wheel.onscroll = () => {
    window.clearTimeout(isScrolling);
    isScrolling = setTimeout(() => {
      const wheelRect = wheel.getBoundingClientRect();
      const wheelCenter = wheelRect.left + wheelRect.width / 2;
      let closestVal = selectedWheelValue;
      let minDiff = Infinity;

      for (let i = 1; i <= 31; i++) {
        const item = document.getElementById(`wheel-item-${i}`);
        if (item) {
          const rect = item.getBoundingClientRect();
          const itemCenter = rect.left + rect.width / 2;
          const diff = Math.abs(wheelCenter - itemCenter);
          if (diff < minDiff) {
            minDiff = diff;
            closestVal = i;
          }
        }
      }
      if (closestVal !== selectedWheelValue) {
        selectWheelValue(closestVal, false);
      }
    }, 50);
  };

  setTimeout(() => {
    selectWheelValue(selectedWheelValue, true);
  }, 50);
}

function selectWheelValue(val, scroll = true) {
  selectedWheelValue = val;
  for (let i = 1; i <= 31; i++) {
    const item = document.getElementById(`wheel-item-${i}`);
    if (item) {
      if (i === val) item.classList.add('active');
      else item.classList.remove('active');
    }
  }
  if (scroll) {
    const wheel = document.getElementById('numberWheel');
    const target = document.getElementById(`wheel-item-${val}`);
    if (target && wheel) {
      const scrollLeft = target.offsetLeft - wheel.offsetWidth / 2 + target.offsetWidth / 2;
      wheel.scrollTo({ left: scrollLeft, behavior: 'smooth' });
    }
  }
  updateWheelLabel();
}

function updateWheelLabel() {
  const label = document.getElementById('wheelLabelInfo');
  if (!label) return;
  let text = '';
  if (selectedRepeatUnit === 'day') {
    text = selectedWheelValue === 1 ? '매일 반복' : `${selectedWheelValue}일마다 반복`;
  } else if (selectedRepeatUnit === 'month') {
    text = selectedWheelValue === 1 ? '매월 반복' : `${selectedWheelValue}개월마다 반복`;
  } else if (selectedRepeatUnit === 'year') {
    text = selectedWheelValue === 1 ? '매년 반복' : `${selectedWheelValue}년마다 반복`;
  }
  label.textContent = text;
}

// ─────────────────────────────────────────────
//  POPUP & AUTO TODAY MODAL
// ─────────────────────────────────────────────
let hasAutoOpenedTodayModal = false;

function autoCheckTodaySchedules() {
  if (hasAutoOpenedTodayModal) return;

  const now = new Date();
  const todayKey = fmtDate(now);
  const todayScheds = getSchedulesForDate(todayKey);

  if (todayScheds && todayScheds.length > 0) {
    hasAutoOpenedTodayModal = true;
    openPopup(todayKey, now.getFullYear(), now.getMonth() + 1, now.getDate());
  }
}

function openPopup(dk, y, m, d) {
  selectedDateKey = dk;
  selectedStartDate = dk;
  selectedEndDate = dk;
  updateDateRangeLabels();

  const todayKey = fmtDate(new Date());
  const popupDate = document.getElementById('popupDate');
  if (popupDate) {
    if (dk === todayKey) {
      popupDate.textContent = `${y}년 ${m}월 ${d}일 오늘 일정 📌`;
    } else {
      popupDate.textContent = `${y}년 ${m}월 ${d}일 일정`;
    }
  }
  
  const allH = { ...getAllHolidays(y), ...getSubstituteHolidays(y) };
  const hInfo = document.getElementById('popupHoliday');
  if (hInfo) {
    if (allH[dk]) { hInfo.style.display = 'block'; hInfo.textContent = '🎌 ' + allH[dk]; }
    else { hInfo.style.display = 'none'; }
  }
  cancelAddForm();
  renderSchedList(dk);
  const overlay = document.getElementById('popupOverlay');
  if (overlay) overlay.classList.add('open');
}
function closePopup() { 
  const overlay = document.getElementById('popupOverlay');
  if (overlay) overlay.classList.remove('open'); 
}
function handleOverlayClick(e) { if (e.target.id === 'popupOverlay') closePopup(); }
function toggleAddForm() { 
  const form = document.getElementById('addForm');
  if (form) {
    form.classList.toggle('open');
    if (form.classList.contains('open')) {
      selectRepeatUnit('none');
      selectedWheelValue = 1;
    }
  }
}

let editingScheduleId = null;

function editSchedule(dk, idx) {
  const ss = getSchedulesForDate(dk);
  const target = ss[idx];
  if (!target) return;

  editingScheduleId = target.id;

  selectedStartDate = target.startDate || dk;
  selectedEndDate = target.endDate || selectedStartDate;
  updateDateRangeLabels();

  const form = document.getElementById('addForm');
  if (form) form.classList.add('open');

  const input = document.getElementById('schedText');
  if (input) input.value = target.text || '';

  let unit = 'none';
  let val = 1;

  if (target.repeat && typeof target.repeat === 'object') {
    unit = target.repeat.unit || 'none';
    val = Number(target.repeat.value) || 1;
  } else if (typeof target.repeat === 'string') {
    if (target.repeat.startsWith('day-')) {
      unit = 'day';
      val = Number(target.repeat.split('-')[1]) || 1;
    } else if (target.repeat.startsWith('month-')) {
      unit = 'month';
      val = Number(target.repeat.split('-')[1]) || 1;
    } else if (target.repeat.startsWith('year-')) {
      unit = 'year';
      val = Number(target.repeat.split('-')[1]) || 1;
    } else if (target.repeat === 'every6') {
      unit = 'day';
      val = 6;
    } else if (target.repeat === 'monthly-day') {
      unit = 'month';
      val = 1;
    } else if (target.repeat === 'yearly') {
      unit = 'year';
      val = 1;
    }
  }

  selectedWheelValue = val;
  selectRepeatUnit(unit);

  const saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.textContent = '수정 완료';
}

function cancelAddForm() {
  const form = document.getElementById('addForm');
  if (form) form.classList.remove('open');
  const input = document.getElementById('schedText');
  if (input) input.value = '';
  editingScheduleId = null;
  selectedStartDate = selectedDateKey;
  selectedEndDate = selectedDateKey;
  updateDateRangeLabels();
  selectRepeatUnit('none');
  selectedWheelValue = 1;
  const saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.textContent = '저장';
}

function renderSchedList(dk) {
  const list = document.getElementById('schedList');
  if (!list) return;
  const ss = getSchedulesForDate(dk);

  list.innerHTML = ss.length ? ss.map((s, i) => {
    const rText = getRepeatText(s.repeat);
    const badge = rText ? `<span class="sched-badge">${rText}</span>` : '';
    return `
      <div class="sched-item">
        <span class="sched-item-text">${s.text}${badge}</span>
        <div class="sched-item-actions">
          <button class="sched-edit-btn" title="수정" onclick="editSchedule('${dk}', ${i})">✏️</button>
          <button class="sched-del-btn" title="삭제" onclick="deleteSchedule('${dk}', ${i})">×</button>
        </div>
      </div>
    `;
  }).join('') : '<div style="color:#999;font-size:13px">일정이 없습니다.</div>';
}

function saveSchedule() {
  const input = document.getElementById('schedText');
  const text = input ? input.value.trim() : '';
  if (!text) return;

  let repeatData = 'none';
  if (selectedRepeatUnit !== 'none') {
    repeatData = {
      unit: selectedRepeatUnit,
      value: selectedWheelValue
    };
  }

  if (editingScheduleId) {
    for (const k in schedules) {
      if (Array.isArray(schedules[k])) {
        const item = schedules[k].find(s => s.id === editingScheduleId);
        if (item) {
          item.text = text;
          item.startDate = sStart;
          item.endDate = sEnd;
          item.repeat = repeatData;
          break;
        }
      }
    }
    sendSystemNotification('✏️ 일정이 수정되었습니다', `[${sStart}] ${text}`);
    editingScheduleId = null;
  } else {
    if (!schedules[selectedDateKey]) schedules[selectedDateKey] = [];
    schedules[selectedDateKey].push({
      text: text,
      startDate: sStart,
      endDate: sEnd,
      repeat: repeatData,
      id: Date.now()
    });
    sendSystemNotification('📅 새 일정이 등록되었습니다', `[${sStart}] ${text}`);
  }

  saveStorage(); render(); closePopup(); updateAppBadge();
  if (input) input.value = '';
  selectRepeatUnit('none');
  selectedWheelValue = 1;
  const saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.textContent = '저장';
}

// ─────────────────────────────────────────────
//  WEB NOTIFICATION & APP BADGE (PWA 잠금화면 알림)
// ─────────────────────────────────────────────
function requestNotificationPermission() {
  if (!('Notification' in window)) {
    alert('이 브라우저는 알림 기능을 지원하지 않습니다.');
    return;
  }

  Notification.requestPermission().then((permission) => {
    updateNotifBtnUI();
    if (permission === 'granted') {
      sendSystemNotification('🔔 알림이 설정되었습니다', '이제 새 일정이 등록되거나 변경될 때 잠금화면 알림이 발송됩니다.');
    }
  });
}

function updateNotifBtnUI() {
  const btn = document.getElementById('notifBtn');
  if (!btn) return;
  if ('Notification' in window && Notification.permission === 'granted') {
    btn.classList.add('active');
    btn.innerHTML = '🔔 알림 켜짐';
  } else {
    btn.classList.remove('active');
    btn.innerHTML = '🔔 알림';
  }
}

function updateAppBadge() {
  if ('setAppBadge' in navigator) {
    const todayKey = fmtDate(new Date());
    const count = getSchedulesForDate(todayKey).length;
    if (count > 0) {
      navigator.setAppBadge(count).catch(() => {});
    } else {
      navigator.clearAppBadge().catch(() => {});
    }
  }
}

function sendSystemNotification(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;

  const options = {
    body: body,
    icon: './icon-192.png',
    badge: './icon-192.png',
    vibrate: [100, 50, 100],
    tag: 'cal-notif-' + Date.now(),
    renotify: true,
    data: { url: './index.html' }
  };

  if (navigator.serviceWorker && navigator.serviceWorker.ready) {
    navigator.serviceWorker.ready.then(registration => {
      registration.showNotification(title, options);
    }).catch(() => {
      new Notification(title, options);
    });
  } else {
    new Notification(title, options);
  }
}
  if (input) input.value = '';
  selectRepeatUnit('none');
  selectedWheelValue = 1;
}

function deleteSchedule(dk, idx) {
  const ss = getSchedulesForDate(dk);
  const target = ss[idx];
  if (target) {
    for (const k in schedules) {
      if (Array.isArray(schedules[k])) {
        schedules[k] = schedules[k].filter(s => s.id !== target.id);
      }
    }
    saveStorage(); render(); renderSchedList(dk);
  }
}
function updateRepeatOptions() {}

// ─────────────────────────────────────────────
//  사용자 현재 위치 기반 날씨 위젯
// ─────────────────────────────────────────────
const FALLBACK_LAT = 35.8242; // 전주
const FALLBACK_LON = 127.1480;

const weatherCodeMap = {
  0: { text: '맑음', icon: '☀️' }, 1: { text: '대체로 맑음', icon: '🌤️' },
  2: { text: '구름 조금', icon: '⛅' }, 3: { text: '흐림', icon: '☁️' },
  45: { text: '안개', icon: '🌫️' }, 48: { text: '침적 안개', icon: '🌫️' },
  51: { text: '가랑비', icon: '🌦️' }, 53: { text: '가랑비', icon: '🌦️' }, 55: { text: '가랑비', icon: '🌦️' },
  61: { text: '비', icon: '🌧️' }, 63: { text: '비', icon: '🌧️' }, 65: { text: '강한 비', icon: '⛈️' },
  71: { text: '눈', icon: '❄️' }, 73: { text: '눈', icon: '❄️' }, 75: { text: '강한 눈', icon: '🌨️' },
  80: { text: '소나기', icon: '🌦️' }, 81: { text: '소나기', icon: '🌦️' }, 82: { text: '강한 소나기', icon: '⛈️' },
  95: { text: '뇌우', icon: '⚡' }
};

let weatherChart;

async function startWeatherWidget() {
  const elLoc = document.getElementById('weatherLocation');
  if (elLoc) elLoc.innerText = '현재 위치 확인 중...';

  let resolved = false;
  const timer = setTimeout(() => {
    if (!resolved) {
      resolved = true;
      tryIPLocation();
    }
  }, 2500);

  if (typeof navigator !== 'undefined' && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        if (!resolved) {
          resolved = true;
          clearTimeout(timer);
          loadWeatherData(pos.coords.latitude, pos.coords.longitude);
        }
      },
      () => {
        if (!resolved) {
          resolved = true;
          clearTimeout(timer);
          tryIPLocation();
        }
      },
      { timeout: 2500, maximumAge: 300000, enableHighAccuracy: false }
    );
  } else {
    clearTimeout(timer);
    tryIPLocation();
  }
}

async function tryIPLocation() {
  try {
    const res = await fetch('https://ipwho.is/?lang=ko').then(r => r.json());
    if (res && res.success && res.latitude && res.longitude) {
      const regionName = `${res.city || ''} (${res.region || ''})`.trim();
      loadWeatherData(res.latitude, res.longitude, regionName);
      return;
    }
  } catch (e) {}

  loadWeatherData(FALLBACK_LAT, FALLBACK_LON, '전주시 (기본)');
}

async function loadWeatherData(lat, lon, fallbackName = '') {
  try {
    const weatherURL = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=14&timezone=Asia%2FSeoul`;
    const airURL = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi`;
    const geoURL = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ko`;

    const [weatherRes, airData, geoData] = await Promise.all([
      fetch(weatherURL).then(r => r.json()).catch(() => null),
      fetch(airURL).then(r => r.json()).catch(() => null),
      fetch(geoURL).then(r => r.json()).catch(() => null)
    ]);

    if (!weatherRes) return;
    updateWeatherUI(weatherRes, airData, geoData, fallbackName);
    drawWeatherChart(weatherRes.daily);
    renderForecastIcons(weatherRes.daily);
  } catch (e) {
    console.error('날씨 데이터 로드 오류:', e);
  }
}

function updateWeatherUI(weatherData, airData, geoData, fallbackName) {
  const current = weatherData.current;
  const weather = weatherCodeMap[current.weather_code] || { text: '맑음', icon: '☀️' };
  
  const addr = geoData?.address || {};
  let location = '';
  if (addr.province || addr.city) {
    const p = addr.province || addr.city;
    const d = addr.district || addr.suburb || addr.borough || addr.town || addr.village || '';
    location = `${p} ${d}`.trim();
  } else {
    location = fallbackName || '현재 위치';
  }

  const elLoc = document.getElementById('weatherLocation');
  const elTemp = document.getElementById('weatherTemp');
  const elDesc = document.getElementById('weatherDesc');
  const elIcon = document.getElementById('weatherIcon');
  const elHum = document.getElementById('weatherHumidity');
  const elWind = document.getElementById('weatherWind');
  const elAQI = document.getElementById('weatherAQI');

  if (elLoc) elLoc.innerText = location;
  if (elTemp) elTemp.innerText = `${Math.round(current.temperature_2m)}°C`;
  if (elDesc) elDesc.innerText = weather.text;
  if (elIcon) elIcon.innerText = weather.icon;
  if (elHum) elHum.innerText = `${current.relative_humidity_2m}%`;
  if (elWind) elWind.innerText = `${current.wind_speed_10m}m/s`;
  if (elAQI) elAQI.innerText = airData?.current?.us_aqi || '--';
}

function drawWeatherChart(daily) {
  const ctx = document.getElementById('weatherChart');
  if (!ctx || typeof Chart === 'undefined') return;
  if (weatherChart) weatherChart.destroy();
  weatherChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: daily.time.map(d => d.split('-').slice(1).join('/')),
      datasets: [
        { label: '최저', data: daily.temperature_2m_min, borderColor: '#2563eb', backgroundColor: 'transparent', borderWidth: 2, tension: 0.3, pointRadius: 2 },
        { label: '최고', data: daily.temperature_2m_max, borderColor: '#e03535', backgroundColor: 'transparent', borderWidth: 2, tension: 0.3, pointRadius: 2 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { font: { size: 10 } } }, y: { ticks: { font: { size: 10 } } } }
    }
  });
}

function renderForecastIcons(daily) {
  const container = document.getElementById('weatherForecastIcons');
  if (!container) return;
  container.innerHTML = '';
  daily.time.forEach((date, i) => {
    const info = weatherCodeMap[daily.weather_code[i]] || { icon: '☀️' };
    const d = date.split('-').slice(1).join('/');
    const item = document.createElement('div');
    item.className = 'weather-forecast-day';
    item.innerHTML = `<div class="weather-forecast-date">${d}</div><div class="weather-forecast-emoji">${info.icon}</div><div class="weather-forecast-temp">${Math.round(daily.temperature_2m_min[i])}°/${Math.round(daily.temperature_2m_max[i])}°</div>`;
    container.appendChild(item);
  });
}

// 브라우저 안전 초기화
(function initApp() {
  function run() {
    try { goToday(); } catch(e) { console.error('goToday error:', e); }
    try { initCalendarGestures(); } catch(e) { console.error('initCalendarGestures error:', e); }
    try { startWeatherWidget(); } catch(e) { console.error('startWeatherWidget error:', e); }
    try { updateNotifBtnUI(); } catch(e) {}
    try { updateAppBadge(); } catch(e) {}
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();
</script>
